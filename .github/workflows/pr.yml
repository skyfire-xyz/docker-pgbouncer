name: Pull Request
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 --severity=warning entrypoint.sh
